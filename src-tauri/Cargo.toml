[package]
name = "escpos-virtual-printer"
version = "1.0.0"
description = "ESC/POS virtual network printer (port 9100) with a live receipt viewer"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[[bin]]
name = "escpos-virtual-printer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
encoding_rs = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
